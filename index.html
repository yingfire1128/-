<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>螢火紫微 - 專業琉璃命盤引擎</title>
    <style>
        :root {
            --bg-glass: rgba(255, 255, 255, 0.7);
            --card-glass: rgba(255, 255, 255, 0.92);
            --card-border: #94a3b8;
            --text-dark: #0f233a;
            --star-main: #831843;
            --star-lucky: #0369a1;
            --star-malefic: #b91c1c;
            --star-minor: #334155;
        }

        * {
            box-sizing: border-box;
        }

        body { 
            font-family: "DFKai-SB", "BiauKai", "標楷體", "STKaiti", serif; 
            background: linear-gradient(135deg, #e0f2fe 0%, #c7d2fe 45%, #e2e8f0 100%);
            margin: 0; 
            padding: 16px 10px; 
            color: var(--text-dark); 
            min-height: 100vh;
        }

        .container { 
            max-width: 1400px; 
            margin: 0 auto; 
            background: var(--bg-glass); 
            padding: 20px; 
            border-radius: 16px; 
            border: 1px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 12px 30px rgba(15, 35, 58, 0.1);
        }

        .brand-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            margin-bottom: 20px;
        }

        .brand-logo-img {
            width: 72px;
            height: 72px;
            object-fit: cover;
            border-radius: 50%;
            box-shadow: 0 4px 16px rgba(234, 179, 8, 0.35);
            border: 1.5px solid rgba(253, 224, 71, 0.7);
            flex-shrink: 0;
            background: #000;
        }

        .brand-title-wrap {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .brand-title-wrap h1 {
            font-size: 30px;
            letter-spacing: 3px;
            margin: 0;
            line-height: 1.1;
            background: linear-gradient(135deg, #0369a1 0%, #1e3a8a 50%, #b45309 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand-subtitle {
            font-size: 13px;
            color: #64748b;
            letter-spacing: 2px;
            margin-top: 3px;
            font-weight: bold;
        }

        .form-section {
            transition: all 0.3s ease;
        }

        .form-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); 
            gap: 14px; 
            margin-bottom: 16px; 
            background: rgba(255, 255, 255, 0.6); 
            padding: 16px 20px; 
            border-radius: 12px; 
            border: 1px solid rgba(255, 255, 255, 0.9); 
        }

        .form-group label { 
            display: block; 
            font-weight: bold; 
            margin-bottom: 5px; 
            font-size: 15px; 
            color: #1e3a5f; 
        }

        .form-group select, .form-group input { 
            width: 100%; 
            padding: 9px 12px; 
            border: 1px solid rgba(148, 163, 184, 0.4); 
            border-radius: 6px; 
            font-size: 16px; 
            box-sizing: border-box; 
            background: rgba(255, 255, 255, 0.95); 
            color: var(--text-dark);
            font-family: inherit; 
            outline: none;
        }

        .auto-calculated { 
            background: rgba(224, 242, 254, 0.65) !important; 
            color: #0369a1 !important; 
            font-weight: bold; 
            border-color: rgba(56, 189, 248, 0.5) !important; 
        }

        .convert-box { 
            grid-column: 1 / -1; 
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.9) 0%, rgba(224, 242, 254, 0.8) 100%); 
            padding: 14px 18px; 
            border-radius: 10px; 
            border: 1px solid rgba(125, 211, 252, 0.6); 
        }

        .convert-box h3 { 
            margin: 0 0 8px 0; 
            font-size: 17px; 
            color: #0369a1; 
        }

        .lunar-info { 
            font-size: 15px; 
            color: #0284c7; 
            margin-top: 6px; 
            font-weight: bold; 
        }

        .btn-submit {
            grid-column: 1 / -1;
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 50%, #075985 100%);
            color: #fff;
            padding: 12px 20px;
            font-size: 19px; 
            font-weight: bold; 
            font-family: inherit; 
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
            letter-spacing: 2px;
            margin-top: 10px;
        }

        .btn-submit:hover { filter: brightness(1.08); }

        .chart-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            gap: 10px;
            flex-wrap: wrap;
        }

        .chart-toolbar h2 {
            font-size: 20px;
            color: #1e3a5f;
            margin: 0;
        }

        .btn-action-group {
            display: flex;
            gap: 10px;
        }

        .btn-action {
            display: inline-flex;
            align-items: center;
            padding: 7px 15px;
            font-size: 15px;
            font-weight: bold;
            font-family: inherit;
            border-radius: 6px;
            cursor: pointer;
            border: 1px solid transparent;
        }

        .btn-back {
            background: #ffffff;
            color: #1e3a5f;
            border-color: rgba(148, 163, 184, 0.5);
        }

        .btn-print {
            background: #0f766e;
            color: #ffffff;
        }

        .a4-sheet {
            width: 100%;
            max-width: 980px;
            aspect-ratio: 1 / 1.414;
            margin: 0 auto 20px auto;
            background: #ffffff;
            padding: 12px;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            display: flex;
            flex-direction: column;
        }

        .grid-chart {
            flex-grow: 1;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 0;
            border-top: 2px solid #334155;
            border-left: 2px solid #334155;
            background: #ffffff;
        }

        .palace-card {
            background: #ffffff;
            padding: 6px 4px;
            box-sizing: border-box;
            position: relative;
            display: flex;
            flex-direction: row;
            border-right: 2px solid #334155;
            border-bottom: 2px solid #334155;
            overflow: hidden;
        }

        .palace-left-col {
            width: 32px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            border-right: 1px solid #cbd5e1;
            padding-right: 3px;
            margin-right: 3px;
            user-select: none;
        }

        .palace-stem-vertical {
            writing-mode: vertical-rl;
            text-orientation: upright;
            font-size: 18px; 
            font-weight: bold;
            color: #0f233a;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 2px;
        }

        .badge-shen {
            background: #e0f2fe;
            color: #0369a1;
            border: 1px solid #38bdf8;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            padding: 2px 1px;
            line-height: 1;
            margin-top: 2px;
        }

        .tag-xiaoxian, .tag-daxian { 
            writing-mode: vertical-rl;
            text-orientation: upright;
            color: #fff; 
            font-weight: bold; 
            font-size: 13px; 
            padding: 4px 2px; 
            border-radius: 4px; 
            letter-spacing: 1px;
            display: inline-block;
            margin-top: 3px;
        }
        .tag-xiaoxian { background: #8b5cf6; } 
        .tag-daxian { background: #059669; } 

        .palace-name-badge {
            writing-mode: vertical-rl;
            text-orientation: upright;
            font-size: 19px; 
            font-weight: 900;
            letter-spacing: 2px;
            padding: 6px 2px;
            border-radius: 5px;
            line-height: 1.1;
        }

        .palace-name-badge.normal {
            background: #fef3c7;
            color: #92400e;
            border: 1px solid #f59e0b;
        }

        .palace-name-badge.is-ming {
            background: #fee2e2;
            color: #b91c1c;
            border: 1.5px solid #ef4444;
        }

        .palace-body {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            overflow: hidden;
            position: relative;
        }

        .primary-stars-row {
            display: flex;
            flex-direction: row-reverse;
            justify-content: flex-start;
            gap: 6px;
            min-height: 150px; 
            padding-bottom: 4px;
            border-bottom: 1px dashed #cbd5e1;
            overflow: visible; 
            flex-shrink: 0;
        }

        .secondary-stars-row {
            display: flex;
            flex-direction: row-reverse; 
            justify-content: flex-start;
            align-items: flex-start; 
            align-content: flex-start;
            flex-wrap: wrap;
            gap: 2px; 
            flex-grow: 1;
            padding-top: 4px;
            overflow: hidden;
        }

        .palace-footer {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            width: 100%;
            margin-top: auto; 
            padding-top: 4px;
            flex-shrink: 0;
        }

        .limit-stack-area {
            display: flex;
            flex-direction: column;
            gap: 1px;
            align-items: flex-start;
        }

        .xiaoxian-line {
            color: #047857;
            font-size: 12px;
            font-weight: bold;
            line-height: 1.2;
            max-width: 170px;
            word-break: break-all;
        }

        .daxian-line {
            font-size: 13px;
            font-weight: bold;
            line-height: 1.1;
            white-space: nowrap;
        }

        .palace-footer-right-group {
            display: flex;
            flex-direction: row-reverse;
            gap: 2px;
            align-items: flex-end;
        }

        .god-v-badge {
            writing-mode: vertical-rl;
            text-orientation: upright;
            font-size: 13px; 
            font-weight: bold;
            letter-spacing: 0.5px;
            padding: 2px 1px;
            border-radius: 3px;
            line-height: 1;
            flex-shrink: 0;
        }

        .boshi-badge { color: #0369a1; background: #f0f9ff; border: 1px solid #bae6fd; }
        .changsheng-badge { color: #166534; background: #f0fdf4; border: 1px solid #bbf7d0; }

        .star-v-block {
            writing-mode: vertical-rl;
            text-orientation: upright;
            display: flex;
            flex-direction: row; 
            align-items: center; 
            justify-content: flex-start; 
            padding: 2px;
            border-radius: 4px;
            line-height: 1.15;
            flex-shrink: 0; 
            white-space: nowrap; 
        }

        .star-name-wrapper {
            display: inline-block;
        }

        .star-v-block.type-main {
            background: #fff7ed;
            color: var(--star-main);
            font-weight: bold;
            font-size: 18px; 
        }

        .star-v-block.type-lucky, .star-v-block.type-malefic {
            background: #f0f9ff;
            color: var(--star-lucky);
            font-size: 15px; 
            font-weight: bold;
            padding: 1px;
        }
        .star-v-block.type-malefic {
            background: #fef2f2;
            color: var(--star-malefic);
        }

        .star-v-block.type-minor {
            background: #f8fafc;
            color: var(--star-minor);
            font-size: 14px; 
            font-weight: bold; 
            padding: 1px;
        }

        .star-v-block.type-annual {
            background: #f0fdf4;
            color: #166534;
            font-size: 14px; 
            font-weight: bold; 
            border: 1px dashed #86efac;
            padding: 1px;
        }

        .star-v-block.type-annual-malefic {
            background: #fef2f2;
            color: #dc2626;
            font-size: 14px; 
            border: 1px dashed #fca5a5;
            font-weight: bold; 
            padding: 1px;
        }

        .natal-miao { color: #047857; font-size: 12px; font-weight: bold; margin-bottom: 2px; display: inline-block; }
        .annual-miao { color: #ea580c; font-size: 12px; font-weight: bold; margin-top: 2px; display: inline-block; }

        .sihua-birth-char, .sihua-daxian-char, .sihua-annual-char {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            border-radius: 2px;
            font-weight: bold;
            font-size: 14px; 
            padding: 3px 2px;
            line-height: 1;
            margin-top: 4px; 
            writing-mode: vertical-rl;
            text-orientation: upright;
            flex-shrink: 0;
        }
        .sihua-birth-char { background: #831843; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.3); }
        .sihua-daxian-char { background: #059669; box-shadow: 0 1px 2px rgba(5, 150, 105, 0.3); }
        .sihua-annual-char { background: #0284c7; box-shadow: 0 1px 2px rgba(2, 132, 199, 0.3); }

        .center-box {
            grid-row: 2 / span 2;
            grid-column: 2 / span 2;
            border-right: 2px solid #334155;
            border-bottom: 2px solid #334155;
            background: #f8fafc;
            padding: 12px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            font-size: 16px; 
            color: #1e3a5f;
            box-sizing: border-box;
            line-height: 1.5;
            position: relative;
            overflow: hidden;
        }

        .center-watermark-bg {
            position: absolute;
            bottom: -5px;
            left: 50%;
            transform: translateX(-50%);
            width: 175px;
            height: 175px;
            object-fit: contain;
            opacity: 0.15;
            pointer-events: none;
            user-select: none;
            z-index: 0;
            border-radius: 50%;
            filter: drop-shadow(0 0 10px rgba(251, 191, 36, 0.45));
        }

        .center-box > * {
            position: relative;
            z-index: 1;
        }

        .center-box h3 { 
            margin: 0 0 4px 0; 
            color: #b45309; 
            font-size: 22px; 
            letter-spacing: 2px;
        }

        .limit-sheet-page {
            display: flex;
            flex-direction: column;
            padding: 24px;
            background: #ffffff;
            color: #0f233a;
            box-sizing: border-box;
            max-width: 100%;
        }

        .limit-header-info {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 2px solid #334155;
            font-size: 12px;
            font-weight: bold;
        }

        .limit-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 16px;
            table-layout: fixed;
        }

        .limit-table td {
            border: 1px solid #64748b;
            text-align: center;
            padding: 8px 4px;
            font-size: 11px;
            vertical-align: middle;
            line-height: 1.3;
        }

        .limit-dec-cell {
            width: 8%;
            font-weight: bold;
            background: #f8fafc;
            color: #1e3a8a;
        }

        .limit-yr-cell {
            width: 9.2%;
        }

        .limit-yr-cell b {
            font-size: 12px;
            color: #b91c1c; 
        }

        .limit-sihua-grid {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); 
            gap: 12px 24px;
            background: #f8fafc;
            border: 1px solid #cbd5e1;
            padding: 16px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: bold;
            width: 100%;
            box-sizing: border-box;
            overflow: hidden;
        }

        .limit-sihua-item {
            display: flex;
            align-items: center;
            border-bottom: 1px dashed #e2e8f0;
            padding-bottom: 6px;
            min-width: 0; 
            flex-wrap: wrap; 
        }

        .limit-sihua-label {
            color: #0369a1;
            width: 50px;
            flex-shrink: 0;
        }

        .limit-sihua-content {
            flex-grow: 1;
            white-space: normal;
        }

        .limit-sihua-target {
            color: #b45309;
            margin-left: 8px;
            display: inline-block;
        }

        @media print {
            @page {
                size: A4 portrait;
                margin: 5mm !important; 
            }
            body, html { 
                width: 100% !important;
                height: 100% !important; 
                background: #ffffff !important; 
                margin: 0 !important; 
                padding: 0 !important; 
                -webkit-print-color-adjust: exact !important; 
                print-color-adjust: exact !important; 
            }
            .container { 
                width: 100% !important;
                max-width: 100% !important; 
                margin: 0 !important; 
                padding: 0 !important; 
                box-shadow: none !important; 
                border: none !important; 
            }
            .form-section, .chart-toolbar, .brand-header { 
                display: none !important; 
            }
            .a4-sheet { 
                width: 100% !important; 
                height: 280mm !important; 
                margin: 0 auto !important; 
                padding: 2mm !important; 
                box-sizing: border-box !important;
                box-shadow: none !important; 
                border-radius: 0 !important; 
                page-break-after: always !important; 
                page-break-inside: avoid !important;
            }
            .grid-chart { 
                width: 100% !important;
                height: 100% !important; 
                border-top: 2px solid #000000 !important; 
                border-left: 2px solid #000000 !important; 
            }
            .palace-card, .center-box { 
                border-right: 2px solid #000000 !important; 
                border-bottom: 2px solid #000000 !important; 
            }
            .center-watermark-bg { opacity: 0.1 !important; }
            
            .primary-stars-row { min-height: 95px !important; gap: 2px !important; overflow: visible !important; }
            .secondary-stars-row { padding-top: 1px !important; gap: 1px !important; }
            
            .palace-stem-vertical { font-size: 15px !important; }
            .palace-name-badge { font-size: 17px !important; padding: 3px 2px !important; }
            .star-v-block.type-main { font-size: 18px !important; }
            
            .star-v-block.type-lucky, .star-v-block.type-malefic { font-size: 14px !important; padding: 1px !important; }
            .star-v-block.type-minor, .star-v-block.type-annual, .star-v-block.type-annual-malefic { font-size: 13px !important; padding: 1px !important; }
            .star-miao-char { font-size: 10px !important; }
            
            .sihua-birth-char, .sihua-daxian-char, .sihua-annual-char { font-size: 13px !important; padding: 2px 1px !important; margin-top: 2px !important; }
            .god-v-badge { font-size: 11px !important; padding: 1px !important; }

            .tag-xiaoxian, .tag-daxian { font-size: 11px !important; padding: 2px !important; margin-top: 2px !important; }
            .xiaoxian-line, .daxian-line { font-size: 11px !important; }
            
            .center-box { font-size: 14px !important; }
            .center-box h3 { font-size: 19px !important; margin-bottom: 2px !important; }

            .limit-sheet-page { padding: 10mm 5mm !important; height: 280mm !important; }
            .limit-table { margin-bottom: 12px !important; width: 100% !important; }
            .limit-table td { padding: 6px 2px !important; font-size: 10px !important; } 
            .limit-yr-cell b { font-size: 11px !important; } 
            .limit-sihua-grid { gap: 4px 10px !important; padding: 10px !important; font-size: 10px !important; width: 100% !important; box-sizing: border-box !important; overflow: hidden !important; } 
            .limit-sihua-item { padding-bottom: 4px !important; flex-wrap: wrap !important; }
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/lunar-javascript@1.6.12/lunar.js"></script>
</head>
<body>

<div class="container">
    <div class="brand-header">
        <img id="brandLogoImg" alt="螢火紫微" class="brand-logo-img" onerror="this.style.display='none'">
        <div class="brand-title-wrap">
            <h1>螢火紫微</h1>
            <span class="brand-subtitle">命理占星 · 紫微斗數</span>
        </div>
    </div>
    
    <div class="form-section" id="formSection">
        <div class="form-grid">
            <div class="form-group" style="grid-column: 1 / -1; background: rgba(255, 255, 255, 0.65); padding: 12px 16px; border-radius: 10px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; border: 1px solid rgba(255, 255, 255, 0.9);">
                <div style="flex: 2; min-width: 200px;">
                    <label style="color: #0f233a;">👤 命主姓名</label>
                    <input type="text" id="userName" placeholder="請填寫姓名" style="font-weight: bold; color: #b45309;">
                </div>
                <div style="flex: 1; min-width: 180px;">
                    <label style="color: #0f233a;">🔭 盤面模式選擇</label>
                    <select id="viewMode" style="font-weight: bold; color: #0284c7;">
                        <option value="natal">本命盤（生年四化）</option>
                        <option value="annual" selected>流年盤（動態流年四化）</option>
                    </select>
                </div>
            </div>

            <div class="convert-box">
                <h3>📅 出生時間與推算設定</h3>
                <div style="display: flex; gap: 12px; flex-wrap: wrap;">
                    <div style="flex: 2; min-width: 180px;">
                        <label>西曆出生日期 <span style="color:red">*</span></label>
                        <input type="date" id="solarDate" onchange="autoCalculateAll(false)">
                    </div>
                    <div style="flex: 1.2; min-width: 130px;">
                        <label>出生時間 <span style="color:red">*</span></label>
                        <input type="time" id="birthTime" onchange="onTimeInputChange()">
                    </div>
                    <div style="flex: 1.2; min-width: 160px;">
                        <label>換算時辰</label>
                        <select id="hourBranch" onchange="autoCalculateAll(false)">
                            <option value="" disabled selected>請選擇/自動換算</option>
                            <option value="子">子時 (23:00-00:59)</option>
                            <option value="丑">丑時 (01:00-02:59)</option>
                            <option value="寅">寅時 (03:00-04:59)</option>
                            <option value="卯">卯時 (05:00-06:59)</option>

    if (!timeStr) return "";

    const h = parseInt(parts[0], 10);

    if (h === 23 || h === 0) return "子";
    if (h >= 1 && h < 3) return "丑";
    if (h >= 3 && h < 5) return "寅";
    if (h >= 5 && h < 7) return "卯";

function autoCalculateAll(triggerRender = true) {
    try {
        const val = document.getElementById('solarDate').value;
        const timeVal = document.getElementById('birthTime').value;
        let hourBranch = document.getElementById('hourBranch').value;

        if (!val || !timeVal || !hourBranch) {
            document.getElementById('lunarInfoText').innerText = "請完整輸入出生日期與時間";
            clearFields();
            return;
        }

        let lunarMonth = 1, lunarDay = 1, yearStem = '甲', yearBranch = '子';

        if (val && typeof Solar !== 'undefined') {
            try {
                let match = val.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
                if (match) {
                    let y = parseInt(match[1]), m = parseInt(match[2]), d = parseInt(match[3]);
                    let timeParts = timeVal.split(":");
                    let hourNum = parseInt(timeParts[0], 10);

                    if (hourNum === 23) {
                        let dt = new Date(y, m - 1, d);
                        dt.setDate(dt.getDate() + 1);
                        y = dt.getFullYear();
                        m = dt.getMonth() + 1;
                        d = dt.getDate();
                    }

                    let solar = Solar.fromYmd(y, m, d);
                    let lunar = solar.getLunar();
                    yearStem = lunar.getYearGan();
                    yearBranch = lunar.getYearZhi();
                    lunarMonth = Math.abs(lunar.getMonth());
                    lunarDay = lunar.getDay();
                    
                    let nightNotice = (hourNum === 23) ? "（23點起算翌日子時）" : "";
                    document.getElementById('lunarInfoText').innerText = `✨ 自動換算：${lunar.getYearInGanZhi()}年 ${lunar.getMonthInChinese()}月 ${lunar.getDayInChinese()} (${lunar.getShengXiao()}) ${nightNotice}`;
                }
            } catch (err) {
                console.warn(err);
            }
        }

        document.getElementById('yearStem').value = yearStem;
        document.getElementById('yearBranch').value = yearBranch;
        document.getElementById('birthMonth').value = lunarMonth;
        document.getElementById('birthDay').value = lunarDay;

        document.getElementById('luBranch').value = luMap[yearStem] || "卯";
        let zuofuIdx = (branches.indexOf("辰") + (lunarMonth - 1)) % 12;
        let youbiIdx = (branches.indexOf("戌") - (lunarMonth - 1) + 120) % 12;
        document.getElementById('zuofuBranch').value = branches[zuofuIdx];
        document.getElementById('youbiBranch').value = branches[youbiIdx];

        const hourOrders = ["子", "丑", "寅", "卯", "辰", "巳", "午", "未", "申", "酉", "戌", "亥"];
        let hIdx = hourOrders.indexOf(hourBranch);
        let mingIdx = (((0 + (lunarMonth - 1)) % 12) - hIdx + 120) % 12;
        let autoMing = branches[mingIdx];
        document.getElementById('mingBranch').value = autoMing;

        let tigerStem = tigerStemMap[yearStem] || "丙";
        let tigerStemIdx = stems.indexOf(tigerStem);
        let distFromYin = (mingIdx - 0 + 12) % 12;
        let mingStemIdx = (tigerStemIdx + distFromYin) % 10;
        let mingJiaZi = stems[mingStemIdx] + autoMing;
        document.getElementById('bureau').value = fullNayinBureauMap[mingJiaZi] || "未知局數";

        if (triggerRender) generateChart();
    } catch (e) {
        if (triggerRender) generateChart();
    }
}

function startGenerate() {
    const val = document.getElementById('solarDate').value;
    const timeVal = document.getElementById('birthTime').value;
    const hourBranch = document.getElementById('hourBranch').value;

    if (!val || !timeVal || !hourBranch) {
        alert("⚠️ 請先完整輸入您的西曆出生日期及時間！");
        return;
    }

    autoCalculateAll(false);
    generateChart();
    document.getElementById('formSection').style.display = 'none';
    document.getElementById('resultContainer').style.display = 'block';
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function backToForm() {

    document.getElementById('resultContainer').style.display = 'none';
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function printChart() {

}

    document.getElementById('liuNianYear').value = new Date().getFullYear();
};

function generateChart() {
    try {
        const userName = document.getElementById('userName').value || '未知命主';
        const viewMode = document.getElementById('viewMode').value || 'natal';
        const solarDateStr = document.getElementById('solarDate').value;
        const birthTimeStr = document.getElementById('birthTime').value;
        const yearStem = document.getElementById('yearStem').value;
        const yearBranch = document.getElementById('yearBranch').value;
        const gender = document.getElementById('gender').value || 'female';
        const birthMonth = parseInt(document.getElementById('birthMonth').value);
        const birthDay = parseInt(document.getElementById('birthDay').value);
        const hourBranch = document.getElementById('hourBranch').value;
        const mingBranch = document.getElementById('mingBranch').value;
        const bureau = document.getElementById('bureau').value;
        
        const lnYear = parseInt(document.getElementById('liuNianYear').value);
        const lnStem = stems[(lnYear - 4) % 10];
        const lnBranch = standardBranches[(lnYear - 4) % 12];

        const isMale = (gender === 'male');
        const isYangStem = ["甲", "丙", "戊", "庚", "壬"].includes(yearStem);
        let yinYangGenderStr = (isYangStem ? "陽" : "陰") + (isMale ? "男" : "女");

        const birthSihua = sihuaMap[yearStem] || {};
        const annualSihua = liuNianSihuaMap[lnStem] || {};

        const hourOrders = ["子", "丑", "寅", "卯", "辰", "巳", "午", "未", "申", "酉", "戌", "亥"];
        let hIdx = hourOrders.indexOf(hourBranch);
        let mingIdx = branches.indexOf(mingBranch);
        
        // 【身宮精準計算公式】：由寅起正月，順數至生月，再順數至生時
        let shenIdx = (((0 + (birthMonth - 1)) % 12) + hIdx + 120) % 12;
        let shenBranch = branches[shenIdx];

        let yearBranchIdx = standardBranches.indexOf(yearBranch);
        let revCountIdx = (0 - (birthMonth - 1) + 120) % 12;
        let birthHourIdx = hourOrders.indexOf(hourBranch);
        let doujunStandardIdx = (revCountIdx + birthHourIdx + 120) % 12;
        let doujunBranchCalc = standardBranches[doujunStandardIdx];

        let mingZhuStar = mingZhuMap[mingBranch] || "";
        let shenZhuStar = shenZhuMap[yearBranch] || "";

        let chart = {};
        branches.forEach(b => chart[b] = { row1: [], row2: [], daxian: '', boshi: '', changsheng: '', xiaoxian: [] });

        const liuLuMap = {"甲": "寅", "乙": "卯", "丙": "巳", "丁": "午", "戊": "巳", "己": "午", "庚": "申", "辛": "酉", "壬": "亥", "癸": "子"};
        const liuLuBranch = liuLuMap[lnStem] || "卯";
        let liuQyBranch = branches[(branches.indexOf(liuLuBranch) + 1) % 12];
        let liuTlBranch = branches[(branches.indexOf(liuLuBranch) - 1 + 12) % 12];
        let liuKy = kuiYueMap[lnStem] || {kui: "丑", yue: "未"};

        let starPosMap = {};

        // 【五行局數與計算】
        let bureauNum = 3;
        if (bureau.includes("水")) bureauNum = 2;
        else if (bureau.includes("木")) bureauNum = 3;
        else if (bureau.includes("金")) bureauNum = 4;
        else if (bureau.includes("土")) bureauNum = 5;
        else if (bureau.includes("火")) bureauNum = 6;

        let birthLunarYear = parseInt(solarDateStr.split('-')[0]); 
        try {
            let parts = solarDateStr.split('-');
            let y = parseInt(parts[0]), month = parseInt(parts[1]), d = parseInt(parts[2]);
            let hourNum = parseInt(birthTimeStr.split(":")[0], 10);
            if (hourNum === 23) {
                let dt = new Date(y, month - 1, d);
                dt.setDate(dt.getDate() + 1);
                y = dt.getFullYear(); month = dt.getMonth() + 1; d = dt.getDate();
            }
            let s = Solar.fromYmd(y, month, d);
            birthLunarYear = s.getLunar().getYear();
        } catch(e) {}

        let age = lnYear - birthLunarYear + 1;

        // 【大限計算】
        let startAge = bureauNum;
        let dxDir = ((isYangStem && isMale) || (!isYangStem && !isMale)) ? 1 : -1;
        let drawDxIdx = (mingIdx + dxDir + 120) % 12; 
        
        let tigerStemIdx = stems.indexOf(tigerStemMap[yearStem] || "丙");
        const branchOrderForGan = ["寅", "卯", "辰", "巳", "午", "未", "申", "酉", "戌", "亥", "子", "丑"];

        let currentDxBranch = "";
        let currentDxStem = "";

        let mingBranchIdx = branchOrderForGan.indexOf(mingBranch);
        let mingStemIdx = (tigerStemIdx + mingBranchIdx) % 10;

        for(let d = 1; d <= 12; d++) {
            let bName = branches[drawDxIdx];
            let ageS = startAge + ((d - 1) * 10);
            let ageE = ageS + 9;
            chart[bName].daxian = `大限: ${ageS}-${ageE}`;
            
            let daxianStemIdx = (mingStemIdx + d * dxDir + 100) % 10;
            let pStem = stems[daxianStemIdx];

            if (age >= ageS && age <= ageE) {
                currentDxBranch = bName;
                currentDxStem = pStem;
            }
            
            drawDxIdx = (drawDxIdx + dxDir + 120) % 12;
        }

        if (!currentDxBranch) {
            currentDxBranch = mingBranch;
            currentDxStem = stems[mingStemIdx];
        }

        const dxSihua = sihuaMap[currentDxStem] || {};

        // 【小限計算】
        let fbhMap = {};
        if(["寅", "午", "戌"].includes(yearBranch)) fbhMap = {huo: "丑", ling: "卯", ma: "申", xian: "辰"};
        else if(["巳", "酉", "丑"].includes(yearBranch)) fbhMap = {huo: "卯", ling: "戌", ma: "亥", xian: "未"};
        else if(["申", "子", "辰"].includes(yearBranch)) fbhMap = {huo: "寅", ling: "戌", ma: "寅", xian: "戌"};
        else if(["亥", "卯", "未"].includes(yearBranch)) fbhMap = {huo: "酉", ling: "戌", ma: "巳", xian: "丑"};

        let xianBranch = fbhMap.xian || "辰";
        let xianIdx = branches.indexOf(xianBranch);
        let xianDir = isMale ? 1 : -1;
        let currentXxBranch = "";

        for (let a = 1; a <= 100; a++) {
            let currPosIdx = (xianIdx + (a - 1) * xianDir + 1200) % 12;
            chart[branches[currPosIdx]].xiaoxian.push(a);
            if (a === age) {
                currentXxBranch = branches[currPosIdx];
            }
        }

        // ==========================================
        // 【核心渲染】：四化完全垂直疊加
        // ==========================================
        function buildVerticalStar(starName, starType, palaceBranch, isAnnual = false) {
            let natalMiaoVal = "";
            let annualMiaoVal = "";

            if (isAnnual) {
                annualMiaoVal = getHardcodedMiao(starName, palaceBranch);
            } else {
                natalMiaoVal = getHardcodedMiao(starName, palaceBranch);
                if (viewMode === 'annual') {
                    annualMiaoVal = getHardcodedMiao(starName, lnBranch);
                }
            }

            let nH = natalMiaoVal ? `<span class="star-miao-char natal-miao">${natalMiaoVal}</span>` : "";
            let aH = "";
            if (annualMiaoVal && viewMode === 'annual' && annualMiaoVal !== natalMiaoVal) {
                aH = `<span class="star-miao-char annual-miao">${annualMiaoVal}</span>`;
            }

            let bSihua = (!isAnnual && birthSihua[starName]) ? `<span class="sihua-birth-char">${birthSihua[starName]}</span>` : "";
            let dSihua = (!isAnnual && viewMode === 'annual' && dxSihua[starName]) ? `<span class="sihua-daxian-char">${dxSihua[starName]}</span>` : "";
            let aSihua = (!isAnnual && viewMode === 'annual' && annualSihua[starName]) ? `<span class="sihua-annual-char">${annualSihua[starName]}</span>` : "";

            return `
                <div class="star-v-block ${starType}">
                    ${nH}
                    <span class="star-name-wrapper">${starName}</span>
                    ${aH}
                    ${bSihua}
                    ${dSihua}
                    ${aSihua}
                </div>
            `;
        }

        function pushStar(branchName, starName, starHtml, isAnnualRow = false) {
            if (branches.includes(branchName)) {
                if (!isAnnualRow) {
                    starPosMap[starName] = branchName; 
                }
                if (row1Stars.includes(starName)) {
                    chart[branchName].row1.push(starHtml);
                } else {
                    chart[branchName].row2.push(starHtml);
                }
            }
        }

        // ==========================================
        // 【核心計算】：14 主星定位邏輯
        // ==========================================
        let x = 0;
        while ((birthDay + x) % bureauNum !== 0) {
            x++;
        }
        let quotient = (birthDay + x) / bureauNum;
        let basePalaceIdx = (quotient - 1) % 12; 
        
        let ziweiIdx = 0;
        if (x === 0) {
            ziweiIdx = basePalaceIdx;
        } else if (x % 2 === 0) {
            ziweiIdx = (basePalaceIdx + x) % 12;
        } else {
            ziweiIdx = (basePalaceIdx - x + 120) % 12;
        }

        let zx = { "紫微": ziweiIdx, "天機": (ziweiIdx - 1 + 12) % 12, "太陽": (ziweiIdx - 3 + 12) % 12, "武曲": (ziweiIdx - 4 + 12) % 12, "天同": (ziweiIdx - 5 + 12) % 12, "廉貞": (ziweiIdx - 8 + 12) % 12 };
        let tianfuIdx = (12 - ziweiIdx) % 12;
        let tfx = { "天府": tianfuIdx, "太陰": (tianfuIdx + 1) % 12, "貪狼": (tianfuIdx + 2) % 12, "巨門": (tianfuIdx + 3) % 12, "天相": (tianfuIdx + 4) % 12, "天梁": (tianfuIdx + 5) % 12, "七殺": (tianfuIdx + 6) % 12, "破軍": (tianfuIdx + 10) % 12 };

        for (let star in zx) {
            let bName = branches[zx[star]];
            pushStar(bName, star, buildVerticalStar(star, "type-main", bName, false));
        }
        for (let star in tfx) {
            let bName = branches[tfx[star]];
            pushStar(bName, star, buildVerticalStar(star, "type-main", bName, false));
        }

        // ==========================================
        // 【其餘星曜排佈】：乙、丙、丁級星
        // ==========================================
        let autoLu = luMap[yearStem] || "卯";
        pushStar(autoLu, "祿存", buildVerticalStar("祿存", "type-lucky", autoLu, false));

        let luIdxNum = branches.indexOf(autoLu);
        let qingyangPos = branches[(luIdxNum + 1) % 12];
        pushStar(qingyangPos, "擎羊", buildVerticalStar("擎羊", "type-malefic", qingyangPos, false));

        let tuoluoPos = branches[(luIdxNum - 1 + 12) % 12];
        pushStar(tuoluoPos, "陀羅", buildVerticalStar("陀羅", "type-malefic", tuoluoPos, false));

        let ky = kuiYueMap[yearStem] || {kui: "丑", yue: "未"};
        pushStar(ky.kui, "天魁", buildVerticalStar("天魁", "type-lucky", ky.kui, false));
        pushStar(ky.yue, "天鉞", buildVerticalStar("天鉞", "type-lucky", ky.yue, false));

        let zfBranch = branches[(branches.indexOf("辰") + (birthMonth - 1)) % 12];
        let ybBranch = branches[(branches.indexOf("戌") - (birthMonth - 1) + 120) % 12];
        pushStar(zfBranch, "左輔", buildVerticalStar("左輔", "type-lucky", zfBranch, false));
        pushStar(ybBranch, "右弼", buildVerticalStar("右弼", "type-lucky", ybBranch, false));

        let wcPos = branches[(branches.indexOf("戌") - hourOrders.indexOf(hourBranch) + 120) % 12];
        pushStar(wcPos, "文昌", buildVerticalStar("文昌", "type-lucky", wcPos, false));

        let wqPos = branches[(branches.indexOf("辰") + hourOrders.indexOf(hourBranch) + 120) % 12];
        pushStar(wqPos, "文曲", buildVerticalStar("文曲", "type-lucky", wqPos, false));

        if(fbhMap.huo) pushStar(fbhMap.huo, "火星", buildVerticalStar("火星", "type-malefic", fbhMap.huo, false));
        if(fbhMap.ling) pushStar(fbhMap.ling, "鈴星", buildVerticalStar("鈴星", "type-malefic", fbhMap.ling, false));

        let djPos = branches[(branches.indexOf("亥") + hourOrders.indexOf(hourBranch) + 120) % 12];
        pushStar(djPos, "地劫", buildVerticalStar("地劫", "type-minor", djPos, false));

        let tkPos = branches[(branches.indexOf("亥") - hourOrders.indexOf(hourBranch) + 120) % 12];
        pushStar(tkPos, "天空", buildVerticalStar("天空", "type-minor", tkPos, false));

        if(fbhMap.ma) pushStar(fbhMap.ma, "天馬", buildVerticalStar("天馬", "type-minor", fbhMap.ma, false));

        let tfPos = branches[(branches.indexOf("午") + hourOrders.indexOf(hourBranch) + 120) % 12];
        let fgPos = branches[(branches.indexOf("寅") + hourOrders.indexOf(hourBranch) + 120) % 12];
        pushStar(tfPos, "台輔", buildVerticalStar("台輔", "type-minor", tfPos, false));
        pushStar(fgPos, "封誥", buildVerticalStar("封誥", "type-minor", fgPos, false));

        let egPos = branches[(branches.indexOf(wcPos) - (birthDay - 1) + 120) % 12];
        let tgPos = branches[(branches.indexOf(wqPos) + (birthDay - 1) + 120) % 12];
        pushStar(egPos, "恩光", buildVerticalStar("恩光", "type-minor", egPos, false));
        pushStar(tgPos, "天貴", buildVerticalStar("天貴", "type-minor", tgPos, false));

        let stPos = branches[(branches.indexOf(zfBranch) + (birthDay - 1) + 120) % 12];
        let bzPos = branches[(branches.indexOf(ybBranch) - (birthDay - 1) + 120) % 12];
        pushStar(stPos, "三台", buildVerticalStar("三台", "type-minor", stPos, false));
        pushStar(bzPos, "八座", buildVerticalStar("八座", "type-minor", bzPos, false));

        let servantBranch = branches[(mingIdx - 7 + 12) % 12];
        let healthBranch = branches[(mingIdx - 5 + 12) % 12];
        pushStar(servantBranch, "天傷", buildVerticalStar("天傷", "type-minor", servantBranch, false));
        pushStar(healthBranch, "天使", buildVerticalStar("天使", "type-minor", healthBranch, false));

        let hlIdx = (branches.indexOf("卯") - yearBranchIdx + 120) % 12;
        let hlBranch = branches[hlIdx];
        let txBranch = branches[(hlIdx + 6) % 12];
        pushStar(hlBranch, "紅鸞", buildVerticalStar("紅鸞", "type-minor", hlBranch, false));
        pushStar(txBranch, "天喜", buildVerticalStar("天喜", "type-minor", txBranch, false));

        let tkuIdx = (branches.indexOf("午") - yearBranchIdx + 120) % 12;
        let txuIdx = (branches.indexOf("午") + yearBranchIdx) % 12;
        pushStar(branches[tkuIdx], "天哭", buildVerticalStar("天哭", "type-minor", branches[tkuIdx], false));
        pushStar(branches[txuIdx], "天虛", buildVerticalStar("天虛", "type-minor", branches[txuIdx], false));

        let lcIdx = (branches.indexOf("辰") + yearBranchIdx) % 12;
        let fgIdx2 = (branches.indexOf("戌") - yearBranchIdx + 120) % 12;
        pushStar(branches[lcIdx], "龍池", buildVerticalStar("龍池", "type-minor", branches[lcIdx], false));
        pushStar(branches[fgIdx2], "鳳閣", buildVerticalStar("鳳閣", "type-minor", branches[fgIdx2], false));
        pushStar(branches[fgIdx2], "解神", buildVerticalStar("解神", "type-minor", branches[fgIdx2], false));

        // 【天才與天壽精準回歸】
        let tcaiIdx = (mingIdx + yearBranchIdx) % 12;
        let tsIdx = (shenIdx + yearBranchIdx) % 12;
        pushStar(branches[tcaiIdx], "天才", buildVerticalStar("天才", "type-minor", branches[tcaiIdx], false));
        pushStar(branches[tsIdx], "天壽", buildVerticalStar("天壽", "type-minor", branches[tsIdx], false));

        const feiLianMap = {"子":"申", "丑":"酉", "寅":"戌", "卯":"巳", "辰":"午", "巳":"未", "午":"寅", "未":"卯", "申":"辰", "酉":"亥", "戌":"子", "亥":"丑"};
        const poSuiMap = {"子":"巳", "午":"巳", "卯":"巳", "酉":"巳", "寅":"酉", "申":"酉", "巳":"酉", "亥":"酉", "辰":"丑", "戌":"丑", "丑":"丑", "未":"丑"};
        let flBranch = feiLianMap[yearBranch];
        let psBranch = poSuiMap[yearBranch];
        if(flBranch) pushStar(flBranch, "蜚廉", buildVerticalStar("蜚廉", "type-minor", flBranch, false));
        if(psBranch) pushStar(psBranch, "破碎", buildVerticalStar("破碎", "type-minor", psBranch, false));

        let tXingIdx = (branches.indexOf("酉") + (birthMonth - 1)) % 12;
        let tYaoIdx = (branches.indexOf("丑") + (birthMonth - 1)) % 12;
        pushStar(branches[tXingIdx], "天刑", buildVerticalStar("天刑", "type-minor", branches[tXingIdx], false));
        pushStar(branches[tYaoIdx], "天姚", buildVerticalStar("天姚", "type-minor", branches[tYaoIdx], false));

        let m = ((birthMonth - 1) % 12) + 1;
        if([1, 2, 3].includes(m)) { pushStar("巳", "孤辰", buildVerticalStar("孤辰", "type-minor", "巳", false)); pushStar("丑", "寡宿", buildVerticalStar("寡宿", "type-minor", "丑", false)); }
        else if([4, 5, 6].includes(m)) { pushStar("申", "孤辰", buildVerticalStar("孤辰", "type-minor", "申", false)); pushStar("辰", "寡宿", buildVerticalStar("寡宿", "type-minor", "辰", false)); }
        else if([7, 8, 9].includes(m)) { pushStar("亥", "孤辰", buildVerticalStar("孤辰", "type-minor", "亥", false)); pushStar("未", "寡宿", buildVerticalStar("寡宿", "type-minor", "未", false)); }
        else if([10, 11, 12].includes(m)) { pushStar("寅", "孤辰", buildVerticalStar("孤辰", "type-minor", "寅", false)); pushStar("戌", "寡宿", buildVerticalStar("寡宿", "type-minor", "戌", false)); }

        let ysPos = "";
        if([1, 7].includes(m)) ysPos = "寅";
        else if([2, 8].includes(m)) ysPos = "子";
        else if([3, 9].includes(m)) ysPos = "戌";
        else if([4, 10].includes(m)) ysPos = "申";
        else if([5, 11].includes(m)) ysPos = "午";
        else if([6, 12].includes(m)) ysPos = "辰";
        if(ysPos) pushStar(ysPos, "陰煞", buildVerticalStar("陰煞", "type-minor", ysPos, false));

        let mb = monthBranchesMap[m] || "亥";
        let twPos = "";
        if(["寅", "午", "戌"].includes(mb)) twPos = "巳";
        else if(["申", "子", "辰"].includes(mb)) twPos = "寅";
        else if(["巳", "酉", "丑"].includes(mb)) twPos = "亥";
        else if(["亥", "卯", "未"].includes(mb)) twPos = "申";
        if(twPos) pushStar(twPos, "天巫", buildVerticalStar("天巫", "type-minor", twPos, false));

        const tyMap = {1:"戌", 2:"巳", 3:"辰", 4:"寅", 5:"未", 6:"卯", 7:"亥", 8:"未", 9:"寅", 10:"午", 11:"戌", 12:"寅"};
        if(tyMap[m]) pushStar(tyMap[m], "天月", buildVerticalStar("天月", "type-minor", tyMap[m], false));

        const tGuanMap = {"甲": "未", "乙": "辰", "丙": "巳", "丁": "寅", "戊": "卯", "己": "酉", "庚": "亥", "辛": "酉", "壬": "戌", "癸": "午"};
        const tFuMap = {"甲": "酉", "乙": "申", "丙": "子", "丁": "亥", "戊": "卯", "己": "寅", "庚": "午", "辛": "巳", "壬": "午", "癸": "巳"};
        const tChuMap = {"甲": "巳", "乙": "午", "丙": "子", "丁": "巳", "戊": "未", "己": "申", "庚": "寅", "辛": "午", "壬": "酉", "癸": "亥"};
        if(tGuanMap[yearStem]) pushStar(tGuanMap[yearStem], "天官", buildVerticalStar("天官", "type-minor", tGuanMap[yearStem], false));
        if(tFuMap[yearStem]) pushStar(tFuMap[yearStem], "天福", buildVerticalStar("天福", "type-minor", tFuMap[yearStem], false));
        if(tChuMap[yearStem]) pushStar(tChuMap[yearStem], "天廚", buildVerticalStar("天廚", "type-minor", tChuMap[yearStem], false));

        const kongMap = {
            "甲": ["申", "酉"], "己": ["申", "酉"], "乙": ["午", "未"], "庚": ["午", "未"],
            "丙": ["辰", "巳"], "辛": ["辰", "巳"], "丁": ["寅", "卯"], "壬": ["寅", "卯"], "戊": ["子", "丑"], "癸": ["子", "丑"]
        };
        let [b1, b2] = kongMap[yearStem] || ["", ""];
        [b1, b2].forEach(b => {
            if (b) {
                let label = ["寅", "辰", "午", "申", "戌", "子"].includes(b) ? "截空" : "截亡";
                pushStar(b, label, buildVerticalStar(label, "type-minor", b, false));
            }
        });

        // 【新增：當生旬空、旬亡】 - 陽支為空、陰支為亡
        function getXunKongWang(stemStr, branchStr) {
            let sIdx = stems.indexOf(stemStr);
            let bIdx = standardBranches.indexOf(branchStr);
            let offset = (bIdx - sIdx + 12) % 12;
            let k1 = standardBranches[(offset + 10) % 12];
            let k2 = standardBranches[(offset + 11) % 12];
            let res = {};
            if (standardBranches.indexOf(k1) % 2 === 0) { // 偶數為陽
                res.kong = k1; res.wang = k2;
            } else {
                res.kong = k2; res.wang = k1;
            }
            return res;
        }
        let natalXun = getXunKongWang(yearStem, yearBranch);
        pushStar(natalXun.kong, "旬空", buildVerticalStar("旬空", "type-minor", natalXun.kong, false));
        pushStar(natalXun.wang, "旬亡", buildVerticalStar("旬亡", "type-minor", natalXun.wang, false));

        // ==========================================
        // 【流年星曜】：全數納入 isAnnualRow = true (合併入 row2)
        // ==========================================
        if (viewMode === 'annual') {
            const jiangqians = ["將星", "攀鞍", "歲驛", "息神", "華蓋", "劫煞", "災煞", "天煞", "指背", "咸池", "月煞", "亡神"];
            let jqStart = "午";
            if (["寅", "午", "戌"].includes(lnBranch)) jqStart = "午";
            else if (["申", "子", "辰"].includes(lnBranch)) jqStart = "子";
            else if (["巳", "酉", "丑"].includes(lnBranch)) jqStart = "酉";
            else if (["亥", "卯", "未"].includes(lnBranch)) jqStart = "卯";

            let jqIdx = standardBranches.indexOf(jqStart);
            for(let i=0; i<12; i++) {
                let b = standardBranches[(jqIdx + i) % 12];
                pushStar(b, jiangqians[i], buildVerticalStar(jiangqians[i], "type-annual", b, true), true);
            }

            const suiqians = ["歲建", "晦氣", "喪門", "貫索", "官符", "小耗", "大耗", "龍德", "白虎", "天德", "吊客", "病符"];
            let sqIdx = standardBranches.indexOf(lnBranch);
            for(let i=0; i<12; i++) {
                let b = standardBranches[(sqIdx + i) % 12];
                pushStar(b, suiqians[i], buildVerticalStar(suiqians[i], "type-annual", b, true), true);
            }

            // 【新增：流年旬空、流年旬亡】
            let annualXun = getXunKongWang(lnStem, lnBranch);
            pushStar(annualXun.kong, "流旬空", buildVerticalStar("流旬空", "type-annual", annualXun.kong, true), true);
            pushStar(annualXun.wang, "流旬亡", buildVerticalStar("流旬亡", "type-annual", annualXun.wang, true), true);

            pushStar(liuLuBranch, "流祿", buildVerticalStar("流祿", "type-annual", liuLuBranch, true), true);
            
            // 【修正：更名為 流擎】
            pushStar(liuQyBranch, "流擎", buildVerticalStar("流擎", "type-annual-malefic", liuQyBranch, true), true);
            
            pushStar(liuTlBranch, "流陀", buildVerticalStar("流陀", "type-annual-malefic", liuTlBranch, true), true);
            pushStar(liuKy.kui, "流魁", buildVerticalStar("流魁", "type-annual", liuKy.kui, true), true);
            pushStar(liuKy.yue, "流鉞", buildVerticalStar("流鉞", "type-annual", liuKy.yue, true), true);

            let liuMaMap = {"寅":"申", "午":"申", "戌":"申", "巳":"亥", "酉":"亥", "丑":"亥", "申":"寅", "子":"寅", "辰":"寅", "亥":"巳", "卯":"巳", "未":"巳"};
            let liuMaPos = liuMaMap[lnBranch];
            if(liuMaPos) pushStar(liuMaPos, "流馬", buildVerticalStar("流馬", "type-annual", liuMaPos, true), true);
        }

        const boshiGods = ["博士", "力士", "青龍", "小耗", "將軍", "奏書", "飛簾", "喜神", "病符", "大耗", "伏兵", "官府"];
        const isYangGenderMale = (isYangStem && isMale) || (!isYangStem && !isMale);
        const boshiDir = isYangGenderMale ? 1 : -1;
        for (let i = 0; i < 12; i++) {
            let b = branches[(luIdxNum + (i * boshiDir) + 120) % 12];
            if (branches.includes(b)) chart[b].boshi = boshiGods[i];
        }

        const csGods = ["長生", "沐浴", "冠帶", "臨官", "帝旺", "衰", "病", "死", "墓", "絕", "胎", "養"];
        let csStartBranch = "申";
        if (bureauNum === 2 || bureauNum === 5) csStartBranch = "申";
        else if (bureauNum === 6) csStartBranch = "寅";
        else if (bureauNum === 4) csStartBranch = "巳";
        else if (bureauNum === 3) csStartBranch = "亥";

        let csStartIdx = branches.indexOf(csStartBranch);
        let csDir = isYangGenderMale ? 1 : -1;
        for (let i = 0; i < 12; i++) {
            let b = branches[(csStartIdx + (i * csDir) + 120) % 12];
            if (branches.includes(b)) chart[b].changsheng = csGods[i];
        }

        const palaceCoords = {
            "巳": {r: 1, c: 1}, "午": {r: 1, c: 2}, "未": {r: 1, c: 3}, "申": {r: 1, c: 4},
            "辰": {r: 2, c: 1},                                     "酉": {r: 2, c: 4},
            "卯": {r: 3, c: 1},                                     "戌": {r: 3, c: 4},
            "寅": {r: 4, c: 1}, "丑": {r: 4, c: 2}, "子": {r: 4, c: 3}, "亥": {r: 4, c: 4}
        };

        let modeTitle = (viewMode === 'annual') ? `【流年盤：${lnYear} ${lnStem}${lnBranch}年】` : `【本命盤】`;
        
        let html = `
            <div class="chart-toolbar">
                <div class="btn-action-group">
                    <button type="button" class="btn-action btn-back" onclick="backToForm()">← 返回修改資料</button>
                </div>
                <h2>排盤結果展示 ${modeTitle}</h2>
                <div class="btn-action-group">
                    <button type="button" class="btn-action btn-print" onclick="printChart()">🖨️ 列印命書 (雙面)</button>
                </div>
            </div>
            
            <div class="a4-sheet">
                <div class="grid-chart">
        `;
        
        branches.forEach(b => {
            let coord = palaceCoords[b];
            let row1Html = chart[b].row1.join('');
            let row2Html = chart[b].row2.join('');
            let daxianTag = chart[b].daxian;
            let boshiTag = chart[b].boshi ? `<span class="god-v-badge boshi-badge">${chart[b].boshi}</span>` : '';
            let changshengTag = chart[b].changsheng ? `<span class="god-v-badge changsheng-badge">${chart[b].changsheng}</span>` : '';
            
            let xiaoxianArr = chart[b].xiaoxian;
            let xiaoxianLines = [];
            for (let i = 0; i < xiaoxianArr.length; i += 4) {
                xiaoxianLines.push(xiaoxianArr.slice(i, i + 4).join(', '));
            }
            let xiaoxianFormatted = xiaoxianLines.join('<br>');
            
            let xiaoxianTag = (b === currentXxBranch && viewMode === 'annual') ? `<div class="tag-xiaoxian">小限命</div>` : "";
            let daxianHighlightTag = (b === currentDxBranch && viewMode === 'annual') ? `<div class="tag-daxian">大限命</div>` : "";
            
            let currBIdx = branches.indexOf(b);
            let palaceOffset = (mingIdx - currBIdx + 12) % 12;
            let palaceName = twelvePalaceNames[palaceOffset];

            let isMingClass = (b === mingBranch) ? "is-ming" : "normal";
            let isShenBadge = (b === shenBranch) ? `<span class="badge-shen">身</span>` : "";
            
            let bIdx = branchOrderForGan.indexOf(b);
            let pStem = stems[(tigerStemIdx + bIdx) % 10];
            let palaceGanZhi = pStem + b;

            html += `
                <div class="palace-card" style="grid-row: ${coord.r}; grid-column: ${coord.c};">
                    <div class="palace-left-col">
                        <div style="display:flex; flex-direction:column; align-items:center; gap:3px;">
                            <div class="palace-stem-vertical">
                                <span>${palaceGanZhi}</span>
                                ${isShenBadge}
                            </div>
                            ${xiaoxianTag}
                            ${daxianHighlightTag}
                        </div>
                        <div class="palace-name-badge ${isMingClass}">
                            ${palaceName}
                        </div>
                    </div>
                    
                    <div class="palace-body">
                        <div class="primary-stars-row">${row1Html || ''}</div>
                        <!-- 副星與流年星統一由右至左排列 -->
                        <div class="secondary-stars-row">${row2Html || ''}</div>
                        
                        <div class="palace-footer">
                            <div class="limit-stack-area">
                                <div class="xiaoxian-line">${xiaoxianFormatted}</div>
                                <div class="daxian-line"><span class="tag-sihua">${daxianTag}</span></div>
                            </div>
                            <div class="palace-footer-right-group">
                                ${boshiTag}
                                ${changshengTag}
                            </div>
                        </div>
                    </div>
                </div>
            `;
        });

        const todayDate = new Date();
        const yyyy = todayDate.getFullYear();
        const mm = String(todayDate.getMonth() + 1).padStart(2, '0');
        const dd = String(todayDate.getDate()).padStart(2, '0');
        const todayStr = `${yyyy}.${mm}.${dd}`;

        let cnLunarDate = getChineseLunarString(birthMonth, birthDay);

        let ageHtml = "";
        if (viewMode === 'annual') {
            ageHtml = `<div style="margin-bottom: 2px; color:#b91c1c; font-weight:bold; font-size:16px;">當生小限(虛歲)：${age}歲 (${lnYear}年)</div>`;
        }

        const zodiacMap = { "子":"鼠", "丑":"牛", "寅":"虎", "卯":"兔", "辰":"龍", "巳":"蛇", "午":"馬", "未":"羊", "申":"猴", "酉":"雞", "戌":"狗", "亥":"豬" };
        let zodiacStr = zodiacMap[yearBranch] || "";

        html += `
                    <div class="center-box">
                        <img src="${LOGO_BASE64}" alt="螢火紫微浮水印" class="center-watermark-bg" onerror="this.style.display='none'">

                        <h3>✨ ${userName} 命盤 ✨</h3>
                        <div style="margin-bottom: 2px;"><b>陽曆：</b>${solarDateStr} ${birthTimeStr} (${hourBranch}時)</div>
                        <div style="margin-bottom: 2px;"><b>農曆：</b>${yearStem}${yearBranch}年 ${cnLunarDate}</div>
                        <div style="margin-bottom: 2px; color:#b45309; font-weight:bold;">${yinYangGenderStr} | <b>${bureau}</b></div>
                        <div style="margin-bottom: 2px; color:#0284c7; font-weight:bold;">子年斗君：<b>${doujunBranchCalc}宮</b></div>
                        <div style="margin-bottom: 2px; color:#701a75; font-size:14px;"><b>命主：</b>${mingZhuStar} | <b>身主：</b>${shenZhuStar}</div>
                        ${ageHtml}
                        <div style="font-size: 12px; color: #64748b; border-top: 1px dashed #cbd5e1; margin-top: 4px; padding-top: 4px;">
                            排盤日期：${todayStr}
                        </div>
                    </div>
                </div>
            </div>

            <div class="page-break"></div>
            <div class="a4-sheet limit-sheet-page">
                
                <div class="limit-header-info">
                    <div>緣人姓名：<span style="color:#b45309; font-size:20px;">${userName}</span> (${yinYangGenderStr}) 生肖${zodiacStr}</div>
                    <div style="text-align: right; font-size: 15px; color:#334155;">
                        <div style="margin-bottom: 4px;">(公曆) ${solarDateStr} ${birthTimeStr}</div>
                        <div>(農曆) ${yearStem}${yearBranch}年 ${cnLunarDate} ${hourBranch}時</div>
                    </div>
                </div>

                <table class="limit-table">
        `;

        html += `<tr><td class="limit-dec-cell" style="background:#e0f2fe;">命<br>宮</td>`;
        let yStIdx = stems.indexOf(yearStem);
        let yBrIdx = standardBranches.indexOf(yearBranch);

        for (let a = 1; a <= 10; a++) {
            if (a < bureauNum) {
                let sy = birthLunarYear + a - 1;
                let sSt = stems[(yStIdx + a - 1) % 10]; 
                let sBr = standardBranches[(yBrIdx + a - 1) % 12];
                html += `<td class="limit-yr-cell"><b>${a}</b><br>${sSt}${sBr}<br>${sy}</td>`;
            } else {
                html += `<td class="limit-yr-cell"></td>`;
            }
        }
        html += `</tr>`;

        let drawTableDxIdx = (mingIdx + dxDir + 120) % 12;
        for (let d = 1; d <= 8; d++) {
            let bName = branches[drawTableDxIdx];
            let daxianStemIdx = (mingStemIdx + d * dxDir + 100) % 10;
            let pStem = stems[daxianStemIdx];
            
            html += `<tr><td class="limit-dec-cell">${pStem}${bName}<br>大限</td>`;
            let ageStart = bureauNum + ((d - 1) * 10);
            for (let step = 0; step < 10; step++) {
                let a = ageStart + step;
                let sy = birthLunarYear + a - 1;
                let sSt = stems[(yStIdx + a - 1) % 10]; 
                let sBr = standardBranches[(yBrIdx + a - 1) % 12];
                html += `<td class="limit-yr-cell"><b>${a}</b><br>${sSt}${sBr}<br>${sy}</td>`;
            }
            html += `</tr>`;
            drawTableDxIdx = (drawTableDxIdx + dxDir + 120) % 12;
        }
        html += `</table>`;

        html += `<div class="limit-sihua-grid">`;
        
        let bStars = Object.keys(birthSihua);
        let bJiStar = bStars[3];
        let bJiBranch = starPosMap[bJiStar] || "子";
        let bJiPalace = twelvePalaceNames[(mingIdx - branches.indexOf(bJiBranch) + 12) % 12];
        
        html += `
            <div class="limit-sihua-item" style="grid-column: 1 / -1; border-bottom: 2px solid #cbd5e1; padding-bottom: 8px;">
                <span class="limit-sihua-label" style="color:#b91c1c;">當 生：</span>
                <span class="limit-sihua-content">(${yearStem}) ${shortStar[bStars[0]]}、${shortStar[bStars[1]]}、${shortStar[bStars[2]]}、${shortStar[bStars[3]]} <span class="limit-sihua-target">(${bJiPalace}宮)</span></span>
            </div>
        `;

        if (viewMode === 'annual' && Object.keys(dxSihua).length > 0) {
            let dxStars = Object.keys(dxSihua);
            let dxJiStar = dxStars[3];
            let jiDxBIdx = starPosMap[dxJiStar] ? branches.indexOf(starPosMap[dxJiStar]) : 0;
            let dxJiPalace = twelvePalaceNames[(mingIdx - jiDxBIdx + 12) % 12];

            html += `
                <div class="limit-sihua-item" style="grid-column: 1 / -1; border-bottom: 2px solid #cbd5e1; padding-bottom: 8px;">
                    <span class="limit-sihua-label" style="color:#059669;">大 限：</span>
                    <span class="limit-sihua-content">(${currentDxStem}) ${shortStar[dxStars[0]]}、${shortStar[dxStars[1]]}、${shortStar[dxStars[2]]}、${shortStar[dxStars[3]]} <span class="limit-sihua-target">(${dxJiPalace}宮)</span></span>
                </div>
            `;
        }

        for(let i=0; i<12; i++) {
            let currBIdx = (mingIdx - i + 12) % 12;
            let bName = branches[currBIdx];
            let pName = twelvePalaceNames[i];
            
            let bIdx = branchOrderForGan.indexOf(bName);
            let pStem = stems[(tigerStemIdx + bIdx) % 10];
            
            let pStars = Object.keys(sihuaMap[pStem]);
            let pJiStar = pStars[3];
            let jiBIdx = starPosMap[pJiStar] ? branches.indexOf(starPosMap[pJiStar]) : 0;
            let pJiPalace = twelvePalaceNames[(mingIdx - jiBIdx + 12) % 12];
            
            html += `
                <div class="limit-sihua-item">
                    <span class="limit-sihua-label">${pName}：</span>
                    <span class="limit-sihua-content">(${pStem}) ${shortStar[pStars[0]]}、${shortStar[pStars[1]]}、${shortStar[pStars[2]]}、${shortStar[pStars[3]]} <span class="limit-sihua-target">(${pJiPalace}宮)</span></span>
                </div>
            `;
        }

        html += `
                </div>
                <div style="margin-top: 16px; text-align: center; color: #64748b; font-size: 13px;">
                    ※ 本命盤由 螢火紫微 引擎精密推算生成
                </div>
            </div>
        `;

        document.getElementById('resultContainer').innerHTML = html;
    } catch (err) {
        console.error(err);
        document.getElementById('resultContainer').innerHTML = `<p style="color:red; font-weight:bold;">⚠️ 排盤計算發生錯誤: ${err.message}</p>`;
    }
}
</script>

</body>
</html>
